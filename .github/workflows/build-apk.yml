name: build-apk
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q SideswipeAI-native.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(find "$SDK" -name sdkmanager -type f | head -n1)"
          echo "sdkmanager at: $SDKM"
          sudo chown -R "$USER" "$SDK"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        working-directory: SideswipeAI
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$(find SideswipeAI/app/build/outputs/apk/release -name '*.apk' | head -n1)" out/SideswipeAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SideswipeAI-apk
          path: out/SideswipeAI.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sideswipe AI (latest)
          files: out/SideswipeAI.apk
          make_latest: true
